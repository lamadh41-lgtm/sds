<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حسابي | متجر مصران</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="fas fa-code me-2"></i>متجر مصران</a>
      <div class="d-flex align-items-center gap-3" id="authArea"></div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="account-card">
      <div class="profile-header">
        <div class="profile-avatar-lg" id="profileAvatar">?</div>
        <div>
          <h3 class="mb-1" id="profileName">جاري التحميل...</h3>
          <p class="text-muted mb-0" id="profileEmail"></p>
        </div>
      </div>

      <hr>

      <form id="accountForm">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">الاسم الكامل</label>
            <input type="text" class="form-control" id="accName" readonly>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="email" class="form-control" id="accEmail" readonly>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">رقم الهاتف</label>
            <input type="text" class="form-control" id="accPhone" readonly>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">نبذة قصيرة</label>
            <input type="text" class="form-control" id="accBio" readonly>
          </div>
        </div>

        <div class="d-flex gap-2 mt-3">
          <button type="button" class="btn btn-outline-primary" id="editBtn">
            <i class="fas fa-edit me-1"></i>تعديل البيانات
          </button>
          <button type="button" class="btn btn-success d-none" id="confirmEditBtn">
            <i class="fas fa-check me-1"></i>تأكيد التعديل
          </button>
          <button type="button" class="btn btn-secondary d-none" id="cancelEditBtn">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Password Confirm Modal -->
  <div class="modal fade" id="passwordConfirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">تأكيد التعديل</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>أدخل كلمة المرور الحالية لتأكيد التعديلات:</p>
          <input type="password" class="form-control" id="confirmPassword" placeholder="كلمة المرور">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
          <button type="button" class="btn btn-primary-custom text-white" id="doConfirmEdit">تأكيد</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <div class="spinner-overlay d-none" id="loadingOverlay">
    <div class="spinner-border text-primary" style="width:3rem;height:3rem;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { auth, db, onAuthStateChanged, doc, getDoc, updateDoc, reauthenticateWithCredential, EmailAuthProvider, updateProfile } from './firebase.js';
    import { showToast, showLoading, getInitials } from './app.js';

    let currentUser = null;
    let originalData = {};

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        location.href = 'index.html';
        return;
      }
      currentUser = user;
      const snap = await getDoc(doc(db, 'users', user.uid));
      const data = snap.exists() ? snap.data() : {};
      originalData = { ...data, email: user.email };

      document.getElementById('profileAvatar').textContent = getInitials(data.name || user.displayName);
      document.getElementById('profileName').textContent = data.name || user.displayName || 'مستخدم';
      document.getElementById('profileEmail').textContent = user.email;
      document.getElementById('accName').value = data.name || '';
      document.getElementById('accEmail').value = user.email;
      document.getElementById('accPhone').value = data.phone || '';
      document.getElementById('accBio').value = data.bio || '';

      // Fill auth area simply
      document.getElementById('authArea').innerHTML = `
        <a href="index.html" class="btn btn-outline-primary btn-sm">الرئيسية</a>
        <a href="purchases.html" class="btn btn-outline-secondary btn-sm">مشترياتي</a>
      `;
    });

    let editing = false;
    document.getElementById('editBtn').addEventListener('click', () => {
      editing = true;
      ['accName', 'accPhone', 'accBio'].forEach(id => {
        document.getElementById(id).removeAttribute('readonly');
      });
      document.getElementById('editBtn').classList.add('d-none');
      document.getElementById('confirmEditBtn').classList.remove('d-none');
      document.getElementById('cancelEditBtn').classList.remove('d-none');
    });

    document.getElementById('cancelEditBtn').addEventListener('click', () => {
      editing = false;
      document.getElementById('accName').value = originalData.name || '';
      document.getElementById('accPhone').value = originalData.phone || '';
      document.getElementById('accBio').value = originalData.bio || '';
      ['accName', 'accPhone', 'accBio'].forEach(id => {
        document.getElementById(id).setAttribute('readonly', true);
      });
      document.getElementById('editBtn').classList.remove('d-none');
      document.getElementById('confirmEditBtn').classList.add('d-none');
      document.getElementById('cancelEditBtn').classList.add('d-none');
    });

    document.getElementById('confirmEditBtn').addEventListener('click', () => {
      new bootstrap.Modal(document.getElementById('passwordConfirmModal')).show();
    });

    document.getElementById('doConfirmEdit').addEventListener('click', async () => {
      const pass = document.getElementById('confirmPassword').value;
      if (!pass) {
        showToast('أدخل كلمة المرور', 'error');
        return;
      }
      showLoading(true);
      try {
        const credential = EmailAuthProvider.credential(currentUser.email, pass);
        await reauthenticateWithCredential(currentUser, credential);

        const newName = document.getElementById('accName').value.trim();
        const newPhone = document.getElementById('accPhone').value.trim();
        const newBio = document.getElementById('accBio').value.trim();

        await updateDoc(doc(db, 'users', currentUser.uid), {
          name: newName,
          phone: newPhone,
          bio: newBio
        });
        await updateProfile(currentUser, { displayName: newName });

        originalData = { ...originalData, name: newName, phone: newPhone, bio: newBio };
        document.getElementById('profileName').textContent = newName;
        document.getElementById('profileAvatar').textContent = getInitials(newName);

        ['accName', 'accPhone', 'accBio'].forEach(id => document.getElementById(id).setAttribute('readonly', true));
        document.getElementById('editBtn').classList.remove('d-none');
        document.getElementById('confirmEditBtn').classList.add('d-none');
        document.getElementById('cancelEditBtn').classList.add('d-none');

        bootstrap.Modal.getInstance(document.getElementById('passwordConfirmModal')).hide();
        showToast('تم تحديث البيانات بنجاح');
      } catch (err) {
        showToast('كلمة المرور غير صحيحة أو حدث خطأ', 'error');
      } finally {
        showLoading(false);
      }
    });
  </script>
</body>
</html>
