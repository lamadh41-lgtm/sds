<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشترياتي | متجر مصران</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="fas fa-code me-2"></i>متجر مصران</a>
      <div class="d-flex gap-2">
        <a href="account.html" class="btn btn-outline-primary btn-sm">حسابي</a>
        <a href="index.html" class="btn btn-outline-secondary btn-sm">الرئيسية</a>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="section-title mb-4" style="text-align:right;">مشترياتي</h2>

    <ul class="nav nav-tabs mb-4" id="purchasesTabs">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#received">المستلمة</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#pending">قيد المراجعة (Pending)</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="received">
        <div id="receivedList" class="row g-3">
          <div class="col-12 text-center text-muted py-4">جاري التحميل...</div>
        </div>
      </div>
      <div class="tab-pane fade" id="pending">
        <div id="pendingList" class="row g-3">
          <div class="col-12 text-center text-muted py-4">جاري التحميل...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { auth, db, onAuthStateChanged, collection, query, where, getDocs, orderBy, doc, getDoc } from './firebase.js';
    import { showToast } from './app.js';

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        location.href = 'index.html';
        return;
      }

      // Received = approved
      const receivedQ = query(collection(db, 'purchases'), where('buyerId', '==', user.uid), where('status', '==', 'approved'));
      const receivedSnap = await getDocs(receivedQ);
      const receivedEl = document.getElementById('receivedList');
      if (receivedSnap.empty) {
        receivedEl.innerHTML = '<div class="col-12 text-center text-muted py-4">لا توجد مشتريات مستلمة بعد</div>';
      } else {
        receivedEl.innerHTML = '';
        // include owned_free as well - re-query simpler
        const allBuy = await getDocs(query(collection(db, 'purchases'), where('buyerId', '==', user.uid)));
        const receivedDocs = allBuy.docs.filter(d => ['approved', 'owned_free'].includes(d.data().status));
        let anyReceived = false;
        receivedEl.innerHTML = '';
        for (const d of receivedDocs) {
          const p = d.data();
          let filesHtml = '';
          let title = p.projectTitle || 'منتج';
          // استخدم اللقطة أولاً (تبقى حتى بعد حذف التاجر)
          const snap = p.snapshot || {};
          if (snap.filesLink) {
            filesHtml = `<a href="${snap.filesLink}" target="_blank" class="btn btn-sm btn-outline-primary me-1 mb-1"><i class="fas fa-download"></i> تحميل المشروع</a>`;
          }
          if (snap.title) title = snap.title;
          // لو مفيش لقطة جرّب المشروع الحي
          if (!filesHtml && p.projectId) {
            try {
              const projSnap = await getDoc(doc(db, 'projects', p.projectId));
              if (projSnap.exists() && projSnap.data().status !== 'deleted') {
                const pd = projSnap.data();
                if (pd.filesLink) filesHtml = `<a href="${pd.filesLink}" target="_blank" class="btn btn-sm btn-outline-primary me-1 mb-1"><i class="fas fa-download"></i> تحميل المشروع</a>`;
                title = pd.title || title;
              }
            } catch(e){}
          }
          anyReceived = true;
          receivedEl.innerHTML += `
            <div class="col-md-6">
              <div class="card h-100">
                <div class="card-body">
                  <h5 class="card-title">${title}</h5>
                  <p class="text-success"><i class="fas fa-check-circle"></i> ${p.status === 'owned_free' ? 'مجاني - محفوظ في مشترياتك' : 'تم القبول - يمكنك التحميل'}</p>
                  <div class="small text-muted mb-1">ID: ${p.projectId || d.id}</div>
                  <div>${filesHtml || '<span class="text-muted">لا توجد ملفات</span>'}</div>
                </div>
              </div>
            </div>
          `;
        }
        if (!anyReceived) {
          receivedEl.innerHTML = '<div class="col-12 text-center text-muted py-4">لا توجد مشتريات مستلمة بعد</div>';
        }
      }

      // Pending
      const pendingQ = query(collection(db, 'purchases'), where('buyerId', '==', user.uid), where('status', 'in', ['pending', 'rejected']));
      const pendingSnap = await getDocs(pendingQ);
      const pendingEl = document.getElementById('pendingList');
      if (pendingSnap.empty) {
        pendingEl.innerHTML = '<div class="col-12 text-center text-muted py-4">لا توجد طلبات قيد المراجعة</div>';
      } else {
        pendingEl.innerHTML = pendingSnap.docs.map(d => {
          const p = d.data();
          let statusBadge = p.status === 'pending' 
            ? '<span class="badge bg-warning text-dark">قيد المراجعة</span>' 
            : `<span class="badge bg-danger">مرفوض</span>`;
          let extra = '';
          if (p.status === 'rejected') {
            extra = `<p class="text-danger small mt-2">السبب: ${p.rejectionReason || 'غير محدد'}</p>`;
            if (p.retryAllowed) {
              extra += `<button class="btn btn-sm btn-outline-primary mt-1 retry-btn" data-id="${d.id}">رفع صورة تحويل جديدة</button>`;
            }
          }
          return `
            <div class="col-md-6">
              <div class="card h-100">
                <div class="card-body">
                  <h5 class="card-title">${p.projectTitle}</h5>
                  <p>المبلغ: ${p.amount} ج.م ${statusBadge}</p>
                  ${extra}
                </div>
              </div>
            </div>
          `;
        }).join('');
      }
    });
  </script>
</body>
</html>
