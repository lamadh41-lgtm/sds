<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الدعم والتواصل | متجر مصران</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="fas fa-code me-2"></i>متجر مصران</a>
      <a href="index.html" class="btn btn-outline-primary btn-sm">الرئيسية</a>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="section-title mb-4">الدعم والتواصل</h2>
    
    <div class="row">
      <div class="col-lg-4 mb-4">
        <div class="account-card text-center">
          <i class="fas fa-phone-alt fa-3x text-primary mb-3"></i>
          <h4>رقم المطور</h4>
          <p class="fs-4 fw-bold" id="devPhone">سيتم إضافته لاحقاً</p>
          <p class="text-muted small">للتواصل المباشر في الحالات العاجلة</p>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="account-card">
          <h4 class="mb-3"><i class="fas fa-comments me-2"></i>الدردشة مع الدعم</h4>
          <div class="chat-box" id="chatBox">
            <div class="text-center text-muted py-4">سجل دخول لبدء المحادثة مع الدعم</div>
          </div>
          <div class="input-group mt-3" id="chatInputArea" style="display:none;">
            <input type="text" class="form-control" id="chatInput" placeholder="اكتب رسالتك...">
            <button class="btn btn-primary" id="sendChatBtn"><i class="fas fa-paper-plane"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { auth, db, onAuthStateChanged, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp } from './firebase.js';
    import { showToast } from './app.js';

    onAuthStateChanged(auth, (user) => {
      if (!user) return;
      document.getElementById('chatInputArea').style.display = 'flex';
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '<div class="text-center text-muted">جاري تحميل المحادثة...</div>';

      const q = query(collection(db, 'supportChats'), where('userId', '==', user.uid), orderBy('createdAt', 'asc'));
      onSnapshot(q, (snap) => {
        if (snap.empty) {
          chatBox.innerHTML = '<div class="text-center text-muted py-3">ابدأ المحادثة بإرسال رسالة</div>';
          return;
        }
        chatBox.innerHTML = snap.docs.map(d => {
          const m = d.data();
          const isMe = m.sender === 'user';
          return `
            <div class="chat-message ${isMe ? 'me' : ''}">
              <div class="chat-bubble">${m.text}</div>
              <small class="text-muted">${m.createdAt?.toDate ? m.createdAt.toDate().toLocaleString('ar-EG') : ''}</small>
            </div>
          `;
        }).join('');
        chatBox.scrollTop = chatBox.scrollHeight;
      });

      document.getElementById('sendChatBtn').onclick = async () => {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;
        await addDoc(collection(db, 'supportChats'), {
          userId: user.uid,
          userEmail: user.email,
          sender: 'user',
          text,
          createdAt: serverTimestamp(),
          read: false
        });
        input.value = '';
      };
    });
  </script>
</body>
</html>
