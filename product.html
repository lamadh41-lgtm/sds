<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المشروع | متجر مصران</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="fas fa-code me-2"></i>متجر مصران</a>
      <div class="d-flex gap-2">
        <a href="projects.html" class="btn btn-outline-primary btn-sm">كل المشاريع</a>
        <a href="index.html" class="btn btn-outline-secondary btn-sm">الرئيسية</a>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div id="productContent">
      <div class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2">جاري التحميل...</p>
      </div>
    </div>
  </div>

  <!-- Buy / Instructions Modal -->
  <div class="modal fade" id="buyModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">شراء المنتج</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-warning">
            <strong>يجب قراءة التعليمات قبل الشراء:</strong>
            <div id="buyInstructions" class="mt-2">
              <!-- سيتم ملؤها لاحقاً -->
              التعليمات الخاصة بالشراء سيتم إضافتها هنا من قبل المطور.
            </div>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="readInstructions">
            <label class="form-check-label" for="readInstructions">قرأت التعليمات وأوافق عليها</label>
          </div>
          <div id="paymentInfo" class="d-none">
            <p>حوّل المبلغ المطلوب إلى الرقم التالي (رقم المطور حالياً):</p>
            <div class="alert alert-info">
              <strong id="devPaymentNumber">سيتم إضافته لاحقاً</strong><br>
              المبلغ: <strong id="payAmount"></strong> ج.م
            </div>
            <div class="mb-3">
              <label class="form-label">رابط صورة التحويل من جوجل درايف *</label>
              <input type="url" class="form-control" id="transferImageLink" placeholder="ارفع صورة التحويل على درايف والصق الرابط">
              <small class="text-muted">ارفع صورة التحويل على حسابك في درايف وشاركها</small>
            </div>
            <button class="btn btn-success w-100" id="confirmPurchaseBtn">تأكيد وإرسال الطلب</button>
          </div>
          <button class="btn btn-primary-custom text-white w-100" id="proceedBuyBtn" disabled>متابعة الشراء</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <div class="spinner-overlay d-none" id="loadingOverlay">
    <div class="spinner-border text-primary" style="width:3rem;height:3rem;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { auth, db, onAuthStateChanged, doc, getDoc, addDoc, collection, serverTimestamp, updateDoc, increment } from './firebase.js';

    // دوال مساعدة محلية عشان منعتمدش على app.js
    function showToast(message, type = 'success') {
      const container = document.querySelector('.toast-container');
      if (!container) { alert(message); return; }
      const id = 'toast-' + Date.now();
      const bg = type === 'success' ? 'bg-success' : 'bg-danger';
      container.insertAdjacentHTML('beforeend', `
        <div id="${id}" class="toast align-items-center text-white ${bg} border-0" role="alert">
          <div class="d-flex">
            <div class="toast-body">${message}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>
        </div>`);
      const toastEl = document.getElementById(id);
      new bootstrap.Toast(toastEl, { delay: 4000 }).show();
    }
    function showLoading(show = true) {
      const el = document.getElementById('loadingOverlay');
      if (el) el.classList.toggle('d-none', !show);
    }

    const urlParams = new URLSearchParams(location.search);
    const projectId = urlParams.get('id');
    let projectData = null;
    let currentUser = null;

    onAuthStateChanged(auth, (user) => { currentUser = user; });

    async function loadProduct() {
      if (!projectId) {
        document.getElementById('productContent').innerHTML = '<div class="alert alert-danger">معرف المشروع غير موجود</div>';
        return;
      }
      try {
        const snap = await getDoc(doc(db, 'projects', projectId));
        if (!snap.exists()) {
          document.getElementById('productContent').innerHTML = '<div class="alert alert-warning">المشروع غير موجود أو تم حذفه</div>';
          return;
        }
        projectData = { id: snap.id, ...snap.data() };
        renderProduct();
      } catch (err) {
        console.error(err);
        document.getElementById('productContent').innerHTML = `<div class="alert alert-danger">
          خطأ في التحميل<br><small>${err.message || err}</small>
        </div>`;
      }
    }

    function renderProduct() {
      const p = projectData;
      const priceHtml = p.isFree || p.price === 0 
        ? '<span class="badge bg-primary fs-5">مجاني</span>' 
        : `<span class="badge bg-success fs-5">${p.price} ج.م</span>`;
      const verified = p.isOfficial 
        ? `<span class="badge-verified"><i class="fas fa-check-circle"></i> المحرك (رسمي)</span>` 
        : '';

      let actionBtn = '';
      if (p.isFree || p.price === 0) {
        actionBtn = `<button class="btn btn-primary-custom text-white btn-lg" id="downloadFreeBtn"><i class="fas fa-download me-2"></i>تحميل المشروع</button>`;
      } else {
        actionBtn = `<button class="btn btn-success btn-lg" id="buyBtn"><i class="fas fa-shopping-cart me-2"></i>شراء المنتج</button>`;
      }

      // محاولة عرض صورة الدرايف بأكثر من طريقة
      let thumbSrc = 'https://via.placeholder.com/500x300?text=No+Image';
      if (p.thumbnailDirect) thumbSrc = p.thumbnailDirect;
      else if (p.thumbnail) {
        // تحويل الرابط لو كان درايف
        const m = p.thumbnail.match(/\/d\/([a-zA-Z0-9_-]+)/) || p.thumbnail.match(/id=([a-zA-Z0-9_-]+)/);
        if (m) thumbSrc = `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1000`;
        else thumbSrc = p.thumbnail;
      }
      const filesSection = p.filesLink 
        ? `<div class="p-3 rounded-3 mb-3" style="background:rgba(212,175,55,0.12);border:1px solid rgba(212,175,55,0.3)">
             <i class="fas fa-cloud-download-alt me-2 text-warning"></i>
             <strong>ملف المشروع على جوجل درايف</strong><br>
             <a href="${p.filesLink}" target="_blank" class="btn btn-warning btn-sm mt-2 text-dark fw-bold">
               <i class="fas fa-download me-1"></i> تحميل / فتح المشروع
             </a>
           </div>`
        : `<div class="text-muted mb-3">لا يوجد رابط مشروع</div>`;

      document.getElementById('productContent').innerHTML = `
        <div class="row">
          <div class="col-lg-5 mb-4">
            <img src="${thumbSrc}" class="img-fluid rounded-4 shadow" alt="${p.title}" onerror="this.src='https://via.placeholder.com/500x300?text=Project'">
          </div>
          <div class="col-lg-7">
            <h1 class="fw-bold mb-2">${p.title} ${verified}</h1>
            <div class="mb-3">${priceHtml}</div>
            <p class="text-muted">بواسطة: <a href="seller.html?id=${p.sellerId || ''}" class="fw-semibold text-decoration-none" style="color:#d4af37">${p.sellerName || 'بائع'}</a></p>
            <hr>
            <h5>الوصف</h5>
            <p style="white-space:pre-wrap;">${p.description || 'لا يوجد وصف'}</p>
            <hr>
            ${filesSection}
            <div id="actionArea" class="mt-3">${actionBtn}</div>
          </div>
        </div>
      `;

      // Events
      document.getElementById('downloadFreeBtn')?.addEventListener('click', handleFreeDownload);
      document.getElementById('buyBtn')?.addEventListener('click', handleBuyClick);
    }

    async function handleFreeDownload() {
      if (!currentUser) {
        showToast('يجب تسجيل الدخول أولاً لتحميل المشروع', 'error');
        return;
      }
      if (projectData.filesLink) {
        window.open(projectData.filesLink, '_blank');
        showToast('تم فتح رابط الملفات على جوجل درايف');
      } else if (projectData.files && projectData.files.length > 0) {
        projectData.files.forEach(f => window.open(f.url, '_blank'));
        showToast('تم فتح روابط التحميل');
      } else {
        showToast('لا يوجد رابط ملفات', 'error');
        return;
      }
      try {
        await updateDoc(doc(db, 'projects', projectId), { downloads: increment(1) });
      } catch(e){}
    }

    function handleBuyClick() {
      if (!currentUser) {
        showToast('يجب تسجيل الدخول أولاً لشراء المنتج', 'error');
        // Could open login modal, but for simplicity redirect or toast
        return;
      }
      document.getElementById('payAmount').textContent = projectData.price;
      document.getElementById('paymentInfo').classList.add('d-none');
      document.getElementById('proceedBuyBtn').disabled = true;
      document.getElementById('readInstructions').checked = false;
      new bootstrap.Modal(document.getElementById('buyModal')).show();
    }

    document.getElementById('readInstructions')?.addEventListener('change', (e) => {
      document.getElementById('proceedBuyBtn').disabled = !e.target.checked;
    });

    document.getElementById('proceedBuyBtn')?.addEventListener('click', () => {
      document.getElementById('paymentInfo').classList.remove('d-none');
      document.getElementById('proceedBuyBtn').classList.add('d-none');
    });

    document.getElementById('confirmPurchaseBtn')?.addEventListener('click', async () => {
      const transferLink = document.getElementById('transferImageLink').value.trim();
      if (!transferLink) {
        showToast('يجب وضع رابط صورة التحويل من جوجل درايف', 'error');
        return;
      }
      showLoading(true);
      try {
        await addDoc(collection(db, 'purchases'), {
          projectId,
          projectTitle: projectData.title,
          buyerId: currentUser.uid,
          buyerEmail: currentUser.email,
          sellerId: projectData.sellerId,
          amount: projectData.price,
          transferImage: transferLink,
          status: 'pending',
          createdAt: serverTimestamp(),
          rejectionReason: '',
          retryAllowed: false
        });

        showToast('تم إرسال طلب الشراء. انتظر بضع دقائق حتى تتم المراجعة والتأكيد.');
        bootstrap.Modal.getInstance(document.getElementById('buyModal')).hide();
      } catch (err) {
        showToast('حدث خطأ: ' + err.message, 'error');
      } finally {
        showLoading(false);
      }
    });

    loadProduct();
  </script>
</body>
</html>
